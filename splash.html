<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everbuy - Your Everyday Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
        }

        .splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeOut 0.6s ease 2.2s forwards;
        }

        .splash-content {
            text-align: center;
        }

        /* Logo */
        .logo {
            font-size: 56px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ff3f6c 0%, #ff6b8a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        /* Tagline */
        .tagline {
            font-size: 11px;
            color: #999;
            letter-spacing: 2px;
            font-weight: 500;
            text-transform: uppercase;
        }

        /* Loader - Simple Dot Animation */
        .loader {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .loader span {
            width: 6px;
            height: 6px;
            background: #ff3f6c;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1s ease-in-out infinite;
        }

        .loader span:nth-child(1) {
            animation-delay: 0s;
        }
        .loader span:nth-child(2) {
            animation-delay: 0.15s;
        }
        .loader span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        /* Fade Out Animation */
        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }
    </style>
</head>
<body>
    <div class="splash">
        <div class="splash-content">
            <div class="logo">EVERBUY</div>
            <div class="tagline">Your Everyday Store</div>
            <div class="loader">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>

    <script>
        // Mark splash as seen
        sessionStorage.setItem('splashSeen', 'true');
        
        // Redirect to home page after 2.5 seconds
        setTimeout(function() {
            window.location.href = 'index.html';
        }, 2500);
    </script>
</body>
</html>
